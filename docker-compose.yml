version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: trustlens_postgres
    environment:
      POSTGRES_DB: trustlens
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5440:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trustlens_backend
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/trustlens
      - APP_ENV=development
      - JWT_SECRET_KEY=supersecretkey_for_local_dev_only

volumes:
  postgres_data:
